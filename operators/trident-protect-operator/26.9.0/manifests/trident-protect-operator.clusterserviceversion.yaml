      - displayName: Pod anti-affinity
        path: crCleanup.podAntiAffinity
      - displayName: Pod anti-affinity
        path: preUpgrade.podAntiAffinity
      - displayName: Pod anti-affinity
        path: webhooksCleanup.podAntiAffinity
      - displayName: Pod affinity
        path: crCleanup.podAffinity
      - displayName: Pod affinity
        path: preUpgrade.podAffinity
      - displayName: Pod affinity
