    - description: TridentProtect is the Schema for the tridentprotects API.
      displayName: Trident Protect
      kind: TridentProtect
      name: tridentprotects.protect.trident.netapp.io
      specDescriptors:
      - description: |-
          ClusterName is recorded as the cluster-name label on backups and snapshots stored in an AppVault.
          When the connector is enabled, it is also the cluster name in NetApp Console, and is required unless an existing cluster ID is set.
        displayName: Cluster name
        path: clusterName
      - description: Connector deploys the Trident Protect Connector and registers
          this cluster with NetApp Console.
        displayName: Connector
        path: connector
      - description: Enabled controls whether the Trident Protect Connector is deployed.
        displayName: Enable connector
        path: connector.enabled
        x-descriptors:
        - urn:alm:descriptor:com.tectonic.ui:booleanSwitch
      - description: Registration is the NetApp Console account, proxy, and optional
          existing cluster record. Required when the connector is enabled.
        displayName: NetApp Console registration
        path: connector.registration
      - description: AccountID is the NetApp Console account that owns this cluster.
        displayName: Account ID
        path: connector.registration.accountID
        x-descriptors:
        - urn:alm:descriptor:com.tectonic.ui:fieldDependency:connector.enabled:true
      - description: ClusterID is the existing TPO cluster record ID. When set, cluster
          name is optional and the connector updates that record instead of creating
          one.
        displayName: Cluster ID
        path: connector.registration.clusterID
        x-descriptors:
        - urn:alm:descriptor:com.tectonic.ui:fieldDependency:connector.enabled:true
      - description: ProxyHostIP is the base URL or IP address of the TP proxy.
        displayName: Proxy URL
        path: connector.registration.proxyHostIP
        x-descriptors:
        - urn:alm:descriptor:com.tectonic.ui:fieldDependency:connector.enabled:true
      - description: ProxySecretName references an existing Secret containing the
          NetApp Console client_id and client_secret.
