      version: v1
  description: |
    Trident Protect Operator installs and manages NetApp Trident Protect without
    embedding Helm. A TridentProtect custom resource defines the operand images,
    feature configuration, RBAC mode, webhook configuration, job resources, and
    uninstall behavior.

    The operator enforces one TridentProtect instance per cluster and supports
    lifecycle cleanup of the operand resources and Trident Protect CRDs.
  displayName: Trident Protect Operator
  relatedImages:
  - name: trident-protect-operator
    image: docker.repo.eng.netapp.com/akarlis/neptune/trident-protect-operator@sha256:d7129297148ea34ab29ed1ce457f10205aac8d1db92ff02807dfd5966852381f
  - name: trident-protect-controller
    image: docker.io/netapp/controller@sha256:46a0066e1cf6940e9c046f1c3c940c39ddeb422c442a989e173cc0e0bec85189
  - name: trident-protect-utils
    image: docker.repo.eng.netapp.com/globalcicd/astra/trident-protect/trident-protect-utils@sha256:cea6607547a8e32b1dce38b5a084daf9f8f9ed02939e8818ae83b07077b1c8d2
  - name: trident-protect-guestfs
    image: docker.repo.eng.netapp.com/globalcicd/astra/trident-protect/trident-protect-guestfs@sha256:20b563ea2948ca180254cf91277761118f4bce992fbb03b4877461d1568ece01
  - name: trident-protect-connector
    image: docker.io/netapp/trident-protect-connector@sha256:a982458a70f76d4219c70bc71d91c2eae032b105e9d8aa863de8f086e9228892
  install:
    spec:
      clusterPermissions:
      - rules:
        - apiGroups:
          - ""
          resources:
          - configmaps
          - secrets
          - serviceaccounts
          - services
          verbs:
          - '*'
        - apiGroups:
          - admissionregistration.k8s.io
          resources:
          - validatingwebhookconfigurations
          verbs:
          - '*'
        - apiGroups:
          - apiextensions.k8s.io
          resources:
          - customresourcedefinitions
          verbs:
          - '*'
        - apiGroups:
          - apps
          resources:
          - deployments
          verbs:
          - '*'
        - apiGroups:
          - batch
          resources:
          - jobs
          verbs:
          - '*'
        - apiGroups:
          - protect.trident.netapp.io
          resources:
          - tridentprotects
          verbs:
          - create
          - delete
          - get
          - list
          - patch
          - update
          - watch
        - apiGroups:
          - protect.trident.netapp.io
          resources:
          - tridentprotects/finalizers
          verbs:
          - update
        - apiGroups:
          - protect.trident.netapp.io
          resources:
          - tridentprotects/status
          verbs:
          - get
          - patch
          - update
        - apiGroups:
          - rbac.authorization.k8s.io
          resources:
          - clusterrolebindings
          - clusterroles
          - rolebindings
          - roles
          verbs:
          - '*'
        - apiGroups:
          - security.openshift.io
          resources:
          - securitycontextconstraints
          verbs:
          - '*'
        - apiGroups:
          - trident.netapp.io
          resources:
          - tridentversions
          verbs:
          - get
          - list
          - watch
        - apiGroups:
          - authentication.k8s.io
          resources:
          - tokenreviews
          verbs:
          - create
        - apiGroups:
          - authorization.k8s.io
          resources:
          - subjectaccessreviews
          verbs:
          - create
        serviceAccountName: operator-controller-manager
      deployments:
      - label:
          app.kubernetes.io/managed-by: kustomize
          app.kubernetes.io/name: operator
          control-plane: trident-protect-operator
        name: operator-controller-manager
        spec:
          replicas: 1
          selector:
            matchLabels:
              app.kubernetes.io/name: operator
              control-plane: trident-protect-operator
          strategy: {}
          template:
            metadata:
              annotations:
                kubectl.kubernetes.io/default-container: manager
              labels:
                app.kubernetes.io/name: operator
                control-plane: trident-protect-operator
            spec:
              containers:
              - args:
                - --metrics-bind-address=:8443
                - --leader-elect
                - --health-probe-bind-address=:8081
                command:
                - /manager
                env:
                - name: ENABLE_WEBHOOKS
                  value: "true"
                - name: DEFAULT_TRIDENT_PROTECT_CONTROLLER_IMAGE
                  value: docker.io/netapp/controller@sha256:46a0066e1cf6940e9c046f1c3c940c39ddeb422c442a989e173cc0e0bec85189
                - name: DEFAULT_TRIDENT_PROTECT_UTILS_IMAGE
                  value: docker.repo.eng.netapp.com/globalcicd/astra/trident-protect/trident-protect-utils@sha256:cea6607547a8e32b1dce38b5a084daf9f8f9ed02939e8818ae83b07077b1c8d2
                - name: DEFAULT_TRIDENT_PROTECT_GUESTFS_IMAGE
                  value: docker.repo.eng.netapp.com/globalcicd/astra/trident-protect/trident-protect-guestfs@sha256:20b563ea2948ca180254cf91277761118f4bce992fbb03b4877461d1568ece01
                - name: DEFAULT_TRIDENT_PROTECT_CONNECTOR_IMAGE
                  value: docker.io/netapp/trident-protect-connector@sha256:a982458a70f76d4219c70bc71d91c2eae032b105e9d8aa863de8f086e9228892
                image: docker.repo.eng.netapp.com/akarlis/neptune/trident-protect-operator@sha256:d7129297148ea34ab29ed1ce457f10205aac8d1db92ff02807dfd5966852381f
                livenessProbe:
                  httpGet:
                    path: /healthz
                    port: 8081
                  initialDelaySeconds: 15
                  periodSeconds: 20
                name: manager
                ports:
                - containerPort: 9443
                  name: webhook-server
                  protocol: TCP
                readinessProbe:
                  httpGet:
                    path: /readyz
                    port: 8081
                  initialDelaySeconds: 5
                  periodSeconds: 10
                resources:
                  limits:
                    cpu: 500m
                    memory: 128Mi
                  requests:
                    cpu: 10m
                    memory: 64Mi
                securityContext:
                  allowPrivilegeEscalation: false
                  capabilities:
                    drop:
                    - ALL
              securityContext:
                runAsNonRoot: true
                seccompProfile:
                  type: RuntimeDefault
              serviceAccountName: operator-controller-manager
              terminationGracePeriodSeconds: 10
      permissions:
      - rules:
        - apiGroups:
          - ""
          resources:
          - configmaps
          verbs:
          - get
          - list
          - watch
          - create
          - update
          - patch
          - delete
        - apiGroups:
          - coordination.k8s.io
          resources:
          - leases
          verbs:
          - get
          - list
          - watch
          - create
          - update
          - patch
          - delete
        - apiGroups:
          - ""
          resources:
          - events
          verbs:
          - create
          - patch
        serviceAccountName: operator-controller-manager
    strategy: deployment
  installModes:
  - supported: false
    type: OwnNamespace
  - supported: false
    type: SingleNamespace
  - supported: false
    type: MultiNamespace
  - supported: true
    type: AllNamespaces
  keywords:
