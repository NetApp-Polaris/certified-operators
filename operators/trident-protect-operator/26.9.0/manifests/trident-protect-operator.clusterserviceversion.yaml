  maintainers:
  - name: NetApp
  maturity: alpha
  minKubeVersion: 1.31.0
  provider:
    name: NetApp
    url: https://www.netapp.com/
  version: 26.9.0
  webhookdefinitions:
  - admissionReviewVersions:
    - v1
    containerPort: 443
    deploymentName: operator-controller-manager
    failurePolicy: Fail
    generateName: vtridentprotect-v1.kb.io
    matchPolicy: Equivalent
    rules:
