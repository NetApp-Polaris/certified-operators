apiVersion: operators.coreos.com/v1alpha1
kind: ClusterServiceVersion
metadata:
  annotations:
    alm-examples: |-
      [
        {
          "apiVersion": "protect.trident.netapp.io/v1",
          "kind": "TridentProtect",
          "metadata": {
            "labels": {
              "app.kubernetes.io/name": "trident-protect"
            },
            "name": "tridentprotect-sample",
            "namespace": "trident-protect"
          },
          "spec": {
            "autoSupport": {
              "enabled": false,
              "url": "https://support.netapp.com/put/AsupPut"
            },
            "connector": {
              "enabled": false
            },
            "crCleanup": {
              "enabled": false,
              "timeout": 600
            },
            "logLevel": "info",
            "namePrefix": "trident-protect",
            "preUpgrade": {
              "enabled": false
            },
            "webhook": {
              "serviceName": "tp-webhook-service",
              "tlsSecretName": "tp-webhook-tls"
            }
          }
        }
      ]
    capabilities: Full Lifecycle
    categories: Storage
    containerImage: docker.repo.eng.netapp.com/akarlis/neptune/trident-protect-operator@sha256:d6baf0a55c5a63d005ceaf826bff73c51cd18e0729a5ef0372131b728c1faf77
    createdAt: "2026-10-08T00:57:02Z"
    description: Install and manage NetApp Trident Protect.
    features.operators.openshift.io/disconnected: "false"
    features.operators.openshift.io/fips-compliant: "false"
    features.operators.openshift.io/proxy-aware: "false"
    features.operators.openshift.io/tls-profiles: "false"
    features.operators.openshift.io/token-auth-aws: "false"
    features.operators.openshift.io/token-auth-azure: "false"
    features.operators.openshift.io/token-auth-gcp: "false"
    operators.openshift.io/valid-subscription: '["Trident Protect"]'
    operators.operatorframework.io/builder: operator-sdk-v1.42.3
    operators.operatorframework.io/project_layout: go.kubebuilder.io/v4
    support: NetApp
  name: trident-protect-operator.v26.9.0
spec:
  apiservicedefinitions: {}
  customresourcedefinitions:
    owned:
    - description: TridentProtect is the Schema for the tridentprotects API.
      displayName: Trident Protect
      kind: TridentProtect
      name: tridentprotects.protect.trident.netapp.io
      specDescriptors:
      - description: |-
          ClusterName is recorded as the cluster-name label on backups and snapshots stored in an AppVault.
          When the connector is enabled, it is also the cluster name in NetApp Console, and is required unless an existing cluster ID is set.
        displayName: Cluster name
        path: clusterName
      - description: Connector deploys the Trident Protect Connector and registers
          this cluster with NetApp Console.
        displayName: Connector
        path: connector
      - description: Enabled controls whether the Trident Protect Connector is deployed.
        displayName: Enable connector
        path: connector.enabled
        x-descriptors:
        - urn:alm:descriptor:com.tectonic.ui:booleanSwitch
      - description: Registration is the NetApp Console account, proxy, and optional
          existing cluster record. Required when the connector is enabled.
        displayName: NetApp Console registration
        path: connector.registration
      - description: AccountID is the NetApp Console account that owns this cluster.
        displayName: Account ID
        path: connector.registration.accountID
        x-descriptors:
        - urn:alm:descriptor:com.tectonic.ui:fieldDependency:connector.enabled:true
      - description: ClusterID is the existing TPO cluster record ID. When set, cluster
          name is optional and the connector updates that record instead of creating
          one.
        displayName: Cluster ID
        path: connector.registration.clusterID
        x-descriptors:
        - urn:alm:descriptor:com.tectonic.ui:fieldDependency:connector.enabled:true
      - description: ProxyHostIP is the base URL or IP address of the TP proxy.
        displayName: Proxy URL
        path: connector.registration.proxyHostIP
        x-descriptors:
        - urn:alm:descriptor:com.tectonic.ui:fieldDependency:connector.enabled:true
      - description: ProxySecretName references an existing Secret containing the
          NetApp Console client_id and client_secret.
        displayName: Proxy credentials
        path: connector.registration.proxySecretName
        x-descriptors:
        - urn:alm:descriptor:io.kubernetes:Secret
        - urn:alm:descriptor:com.tectonic.ui:fieldDependency:connector.enabled:true
      - description: AgentID identifies an existing NetApp Console connector. Optional.
        displayName: Agent ID
        path: connector.registration.agentID
        x-descriptors:
        - urn:alm:descriptor:com.tectonic.ui:fieldDependency:connector.enabled:true
      - description: |-
          Image configures the connector image. Registry defaults to imageRegistry,
          repository defaults to trident-protect-connector, and tag defaults to the
          connector release built into the operator.
        displayName: Connector image
        path: connector.image
        x-descriptors:
        - urn:alm:descriptor:com.tectonic.ui:fieldDependency:connector.enabled:true
      - description: ImagePullSecrets lists Secrets used to pull the connector image.
        displayName: Connector image pull secrets
        path: connector.imagePullSecrets
        x-descriptors:
        - urn:alm:descriptor:com.tectonic.ui:fieldDependency:connector.enabled:true
      - displayName: Connector resources
        path: connector.resources
        x-descriptors:
        - urn:alm:descriptor:com.tectonic.ui:fieldDependency:connector.enabled:true
      - displayName: Connector security context
        path: connector.securityContext
        x-descriptors:
        - urn:alm:descriptor:com.tectonic.ui:fieldDependency:connector.enabled:true
      - description: LogLevel controls connector logging verbosity.
        displayName: Connector log level
        path: connector.logLevel
        x-descriptors:
        - urn:alm:descriptor:com.tectonic.ui:select:debug
        - urn:alm:descriptor:com.tectonic.ui:select:info
        - urn:alm:descriptor:com.tectonic.ui:select:warn
        - urn:alm:descriptor:com.tectonic.ui:select:error
        - urn:alm:descriptor:com.tectonic.ui:fieldDependency:connector.enabled:true
      - description: SkipRegister deploys the connector without registering the cluster.
          The cluster stays disconnected in NetApp Console.
        displayName: Skip cluster registration
        path: connector.skipRegister
        x-descriptors:
        - urn:alm:descriptor:com.tectonic.ui:booleanSwitch
        - urn:alm:descriptor:com.tectonic.ui:fieldDependency:connector.enabled:true
      - displayName: Skip TLS validation
        path: connector.skipTLSValidation
        x-descriptors:
        - urn:alm:descriptor:com.tectonic.ui:booleanSwitch
        - urn:alm:descriptor:com.tectonic.ui:fieldDependency:connector.enabled:true
      - displayName: AutoSupport
        path: autoSupport
      - displayName: Enable AutoSupport
        path: autoSupport.enabled
        x-descriptors:
        - urn:alm:descriptor:com.tectonic.ui:booleanSwitch
      - displayName: Insecure AutoSupport
        path: autoSupport.insecure
        x-descriptors:
        - urn:alm:descriptor:com.tectonic.ui:booleanSwitch
      - displayName: AutoSupport proxy
        path: autoSupport.proxy
      - displayName: AutoSupport URL
        path: autoSupport.url
      - displayName: AutoSupport image
        path: autoSupport.image
