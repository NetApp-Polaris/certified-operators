        x-descriptors:
        - urn:alm:descriptor:io.kubernetes:Secret
        - urn:alm:descriptor:com.tectonic.ui:fieldDependency:connector.enabled:true
      - description: AgentID identifies an existing NetApp Console connector. Optional.
        displayName: Agent ID
        path: connector.registration.agentID
        x-descriptors:
        - urn:alm:descriptor:com.tectonic.ui:fieldDependency:connector.enabled:true
      - description: |-
          Image configures the connector image. Registry defaults to imageRegistry,
          repository defaults to trident-protect-connector, and tag defaults to the
          connector release built into the operator.
        displayName: Connector image
        path: connector.image
        x-descriptors:
