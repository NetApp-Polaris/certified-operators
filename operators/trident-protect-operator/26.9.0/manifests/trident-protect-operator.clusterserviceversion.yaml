      version: v1
  description: |
    This operator installs and manages NetApp Trident Protect. A TridentProtect custom resource defines the operand images,
    feature configuration, RBAC mode, webhook configuration, job resources, and
    uninstall behavior.

    The operator enforces one TridentProtect instance per cluster and supports
    lifecycle cleanup of the operand resources and Trident Protect CRDs.
  displayName: NetApp Trident Protect
  icon:
  - base64data: 
    mediatype: image/png
  install:
    spec:
      clusterPermissions:
      - rules:
        - apiGroups:
          - ""
          resources:
          - configmaps
          - secrets
          - serviceaccounts
          - services
          verbs:
          - '*'
        - apiGroups:
          - admissionregistration.k8s.io
          resources:
          - validatingwebhookconfigurations
          verbs:
          - '*'
        - apiGroups:
          - apiextensions.k8s.io
          resources:
          - customresourcedefinitions
          verbs:
          - '*'
        - apiGroups:
          - apps
          resources:
          - deployments
          verbs:
          - '*'
        - apiGroups:
          - batch
          resources:
          - jobs
          verbs:
          - '*'
        - apiGroups:
          - protect.trident.netapp.io
          resources:
          - tridentprotects
          verbs:
          - create
          - delete
          - get
          - list
          - patch
          - update
          - watch
        - apiGroups:
          - protect.trident.netapp.io
          resources:
          - tridentprotects/finalizers
          verbs:
          - update
        - apiGroups:
          - protect.trident.netapp.io
          resources:
          - tridentprotects/status
          verbs:
          - get
          - patch
          - update
        - apiGroups:
          - rbac.authorization.k8s.io
          resources:
          - clusterrolebindings
          - clusterroles
          - rolebindings
          - roles
          verbs:
          - '*'
        - apiGroups:
          - security.openshift.io
          resources:
          - securitycontextconstraints
          verbs:
          - create
          - get
          - list
        - apiGroups:
          - security.openshift.io
          resourceNames:
          - trident-protect-filebrowse
          - trident-protect-job
          resources:
          - securitycontextconstraints
          verbs:
          - delete
          - patch
        - apiGroups:
          - trident.netapp.io
          resources:
          - tridentversions
          verbs:
          - get
          - list
          - watch
        - apiGroups:
          - authentication.k8s.io
          resources:
          - tokenreviews
          verbs:
          - create
        - apiGroups:
          - authorization.k8s.io
          resources:
          - subjectaccessreviews
          verbs:
          - create
        serviceAccountName: operator-controller-manager
      deployments:
      - label:
          app.kubernetes.io/managed-by: kustomize
          app.kubernetes.io/name: operator
          control-plane: trident-protect-operator
        name: operator-controller-manager
        spec:
          replicas: 1
          selector:
            matchLabels:
              app.kubernetes.io/name: operator
              control-plane: trident-protect-operator
          strategy: {}
          template:
            metadata:
              annotations:
                kubectl.kubernetes.io/default-container: manager
              labels:
                app.kubernetes.io/name: operator
                control-plane: trident-protect-operator
            spec:
              containers:
              - args:
                - --metrics-bind-address=:8443
                - --leader-elect
                - --health-probe-bind-address=:8081
                command:
                - /manager
                env:
                - name: ENABLE_WEBHOOKS
                  value: "true"
                - name: DEFAULT_TRIDENT_PROTECT_CONTROLLER_IMAGE
                  value: netapp/controller:26.09.0-console
                - name: DEFAULT_TRIDENT_PROTECT_UTILS_IMAGE
                  value: netapp/trident-protect-utils:v5.0.0
                - name: DEFAULT_TRIDENT_PROTECT_GUESTFS_IMAGE
                  value: netapp/trident-protect-guestfs:v2.0.0
                - name: DEFAULT_TRIDENT_PROTECT_CONNECTOR_IMAGE
                  value: netapp/trident-protect-connector:26.09.0-console
                - name: RELATED_IMAGE_AUTOSUPPORT
                  value: docker.repo.eng.netapp.com/globalcicd/astra/trident-protect/trident-autosupport@sha256:124d04e1c875b82fe63a987d7d6d9a3e40c5755ce94664d54b0246d480ef0c60
                - name: RELATED_IMAGE_EXECHOOK
                  value: docker.repo.eng.netapp.com/globalcicd/astra/trident-protect/exechook@sha256:91b6e54e78470ab35d005bbc3e066e8f6e3e735066ffdd30b22a738145533fb5
                - name: RELATED_IMAGE_FILEBROWSE_TRANSFER
                  value: docker.repo.eng.netapp.com/globalcicd/astra/trident-protect/filebrowse-transfer@sha256:94b2955a92845f8e68bfe53a385478547dc73076c9d88d9a355810c1d831eec9
                - name: RELATED_IMAGE_KOPIABLOCKRESTORE
                  value: docker.repo.eng.netapp.com/globalcicd/astra/trident-protect/kopiablockrestore@sha256:202568b1292d1929efc248b2049217e97521414b2a3b4cbb29eda794c2a246d8
                - name: RELATED_IMAGE_RESOURCEBACKUP
                  value: docker.repo.eng.netapp.com/globalcicd/astra/trident-protect/resourcebackup@sha256:d41999f9f6c92d35cb28e9933a44e04b960d8f5b7a004dcd49985b133133d796
                - name: RELATED_IMAGE_RESOURCEDELETE
                  value: docker.repo.eng.netapp.com/globalcicd/astra/trident-protect/resourcedelete@sha256:4921f6d7263c0af96f07803b9396a58ba4f4f85388bfdb9f02426f6947c45134
                - name: RELATED_IMAGE_RESOURCERESTORE
                  value: docker.repo.eng.netapp.com/globalcicd/astra/trident-protect/resourcerestore@sha256:f50548ee49b736c614203721bf10e0729e8da234f196860d0132780518b62caf
                - name: RELATED_IMAGE_TRIDENT_PROTECT_CONTROLLER
                  value: docker.repo.eng.netapp.com/globalcicd/astra/trident-protect/controller@sha256:46a0066e1cf6940e9c046f1c3c940c39ddeb422c442a989e173cc0e0bec85189
                - name: RELATED_IMAGE_TRIDENT_PROTECT_GUESTFS
                  value: docker.repo.eng.netapp.com/globalcicd/astra/trident-protect/trident-protect-guestfs@sha256:20b563ea2948ca180254cf91277761118f4bce992fbb03b4877461d1568ece01
                - name: RELATED_IMAGE_TRIDENT_PROTECT_UTILS
                  value: docker.repo.eng.netapp.com/globalcicd/astra/trident-protect/trident-protect-utils@sha256:cea6607547a8e32b1dce38b5a084daf9f8f9ed02939e8818ae83b07077b1c8d2
                - name: TRIDENT_PROTECT_IMAGE_TAG
                  value: 26.09.0
                image: docker.repo.eng.netapp.com/akarlis/neptune/trident-protect-operator@sha256:d6baf0a55c5a63d005ceaf826bff73c51cd18e0729a5ef0372131b728c1faf77
                livenessProbe:
                  httpGet:
                    path: /healthz
                    port: 8081
                  initialDelaySeconds: 15
                  periodSeconds: 20
                name: manager
                ports:
                - containerPort: 9443
                  name: webhook-server
                  protocol: TCP
                readinessProbe:
                  httpGet:
                    path: /readyz
                    port: 8081
                  initialDelaySeconds: 5
                  periodSeconds: 10
                resources:
                  limits:
                    cpu: 500m
                    memory: 128Mi
                  requests:
                    cpu: 10m
                    memory: 64Mi
                securityContext:
                  allowPrivilegeEscalation: false
                  capabilities:
                    drop:
                    - ALL
